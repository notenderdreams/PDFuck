[package]
name = "pdfuck"
version = "0.1.0"
description = "Desktop PDF Reader & Annotation Studio"
authors = ["PDFuck Team"]
edition = "2021"

[lib]
name = "pdfuck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
rfd = "0.15"
base64 = "0.22"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["time", "rt", "sync"] }
lopdf = { version = "0.44", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

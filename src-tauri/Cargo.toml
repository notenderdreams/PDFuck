[package]
name = "pdfuck"
version = "1.0.0"
description = "PDFuck — Pro Desktop PDF Reader & Annotation Studio"
authors = ["PDFuck Team"]
edition = "2021"

[lib]
name = "pdfuck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
rfd = "0.15"
base64 = "0.22"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
